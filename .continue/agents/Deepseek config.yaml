name: DeepSeek Config
version: 1.0.0
schema: v1

models:
  - name: DeepSeek Chat
    provider: deepseek
    model: deepseek-chat
    apiKey: sk-01884aacf18a419d934e33c625336987
    contextLength: 128000
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.0
      maxTokens: 8192
    capabilities:
      - tool_use

  - name: DeepSeek Reasoner
    provider: deepseek
    model: deepseek-reasoner
    apiKey: sk-01884aacf18a419d934e33c625336987}
    contextLength: 128000
    roles:
      - chat

  - name: qwen2.5-coder 7b
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - autocomplete

context:
  - provider: code
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
  - provider: codebase