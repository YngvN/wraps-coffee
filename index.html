<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/src/assets/images/logo/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    /*
      Rewrites the viewport above to a fixed CSS width when the kiosk URL carries `?renderWidthPx=`
      (the ADHDisplay Companion forwards this per-display setting — see `DisplayRenderWidth` in
      src/types/displayMachine.ts for the measurement that motivates it, and `useDisplayRenderWidth`
      for the web-side reader).

      Inline and here, rather than anywhere in React: the viewport has to be right *before the first
      layout*, which happens long before the bundle executes. Setting it later works but forces a full
      re-layout of the whole kiosk page at boot, which on the weakest fleet hardware is exactly the
      kind of cost this setting exists to avoid.

      Anything without the param (a browser tab, an Electron display, either editor, the admin grid)
      falls through untouched and keeps `width=device-width`, i.e. today's behavior. Kept dependency-
      free and in ES5 so it can never itself be the thing that fails to parse on an old WebView.
    */
    (function () {
      try {
        var raw = new URLSearchParams(window.location.search).get('renderWidthPx')
        if (!raw || raw === 'auto') return
        var width = Number(raw)
        // Validated against the real option list (DISPLAY_RENDER_WIDTH_OPTIONS), not merely "is a
        // number", so a stale or hand-edited URL can't pin a display to an arbitrary layout width.
        if ([3840, 2560, 1920, 1280].indexOf(width) === -1) return
        var meta = document.querySelector('meta[name="viewport"]')
        // Deliberately `width=` ALONE, with no `initial-scale` (fixed 2026-08-18, caught on the real
        // TV). `initial-scale=1.0` pins 1 CSS px to 1 density-independent px, so on this fleet's
        // density-2 panel a 1920 CSS viewport demanded 3840 device px and rendered ~2x zoomed with the
        // right-hand panes clipped off screen. Omitting it lets the browser derive the page scale that
        // fits `width` to the actual surface, which is the whole point. Note the CSS *layout* metrics
        // looked perfect either way — `innerWidth`, resolved scale and overflow all read correct with
        // the zoom bug present — so this can only be caught by looking at the screen, never by probing.
        if (meta) meta.setAttribute('content', 'width=' + width)
      } catch (error) {
        /* A malformed URL must never keep the kiosk from booting — fall through to the default. */
      }
    })()
  </script>
  <title>Store Dashboard</title>
  <!--
    Self-hosted, not fonts.googleapis.com. Generated by scripts/fetch-google-fonts.mts into
    public/fonts/ (so Vite copies it into dist/ and the installer's existing public\* entry ships
    it), and covering every family in src/data/googleFonts.json rather than only the handful this
    page used to name — so a font picked in the admin renders offline too, without a second request
    path. Two reasons this matters beyond tidiness:

      1. A kiosk must render correct typography with no internet. The old <link> made every screen's
         type silently fall back to a system font whenever the connection was down.
      2. html-to-image has to inline every @font-face source into a capture, and against a
         cross-origin CDN that meant ~100 requests per capture — slow enough on the Android TV to
         look like a hang. Same-origin makes it fast and deterministic.

    Re-run `npm run fonts:fetch` after changing src/data/googleFonts.json.
  -->
  <link href="/fonts/google-fonts.css" rel="stylesheet" />
  <script>
    // Set the theme on <html> before first paint to avoid a flash of the
    // wrong theme. The Android TV companion app's WebView always loads
    // straight into a fresh, empty profile (no stored preference, no
    // reliable OS dark-mode signal), so a plain localStorage/OS-preference
    // fallback would default to light and flash before the screen's own
    // configured color takes over. That WebView appends "ADHDisplayKiosk"
    // to its user agent (see adhdisplay-companion's DisplayScreen.tsx) —
    // detected here and forced dark, ahead of the normal fallback chain.
    // Route-independent by design, and can't be triggered from a normal
    // browser.
    ; (function () {
      var isKiosk = /ADHDisplayKiosk/.test(navigator.userAgent)
      var stored = localStorage.getItem('theme')
      var theme = isKiosk
        ? 'dark'
        : stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
