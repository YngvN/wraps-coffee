<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/src/assets/images/logo/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Pangolin&family=Quicksand:wght@300..700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    // Set the theme on <html> before first paint to avoid a flash of the
    // wrong theme. The Android TV companion app's WebView always loads
    // straight into a fresh, empty profile (no stored preference, no
    // reliable OS dark-mode signal), so a plain localStorage/OS-preference
    // fallback would default to light and flash before the screen's own
    // configured color takes over. That WebView appends "ADHDisplayKiosk"
    // to its user agent (see adhdisplay-companion's DisplayScreen.tsx) —
    // detected here and forced dark, ahead of the normal fallback chain.
    // Route-independent by design, and can't be triggered from a normal
    // browser.
    ; (function () {
      var isKiosk = /ADHDisplayKiosk/.test(navigator.userAgent)
      var stored = localStorage.getItem('theme')
      var theme = isKiosk
        ? 'dark'
        : stored === 'light' || stored === 'dark'
          ? stored
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
