name: Build ADHDisplay Companion installers

# Manually triggered (Actions tab -> Build ADHDisplay Companion installers ->
# Run workflow). Separate from build-installer.yml (the main app's own
# Windows installer) since adhdisplay-companion/ is a fully independent
# package with its own release cadence - see that app's own README's
# "Windows & Linux" and "Building an APK" sections. Builds only the Companion
# app's own Windows installer (an Electron kiosk shell wrapping its Expo web
# export) - uploaded directly as this workflow's one artifact.
#
# The Android TV release APK used to be built here too, then zipped together
# with this installer by a third `package` job - removed after GitHub's
# Ubuntu runner started failing that build with a Kotlin/Compose-compiler
# version mismatch in expo-modules-core:compileReleaseKotlin that doesn't
# reproduce on a real dev machine (same `npm run build:tv`, same
# -Pandroid.kotlinVersion flag, builds clean locally - runner-environment-
# specific, not a code issue). The APK is instead built as part of the main
# ADHDisplay installer's own CI workflow (build-installer.yml, on
# windows-latest rather than the Ubuntu runner that hit the mismatch above)
# and for a local build via installer/build-with-apk.ps1 - see
# installer/adhdisplay.iss for why it needs to exist before that ISCC run.
on:
  workflow_dispatch: {}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download latest Node.js LTS installer
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri 'https://nodejs.org/dist/index.json'
          $lts = $releases | Where-Object { $_.lts -ne $false } | Select-Object -First 1
          $url = "https://nodejs.org/dist/$($lts.version)/node-$($lts.version)-x64.msi"
          Write-Host "Downloading Node.js $($lts.version) ($($lts.lts)) from $url"
          Invoke-WebRequest -Uri $url -OutFile 'installer/node-lts-x64.msi'

      - name: Compile Companion installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\adhdisplay-companion.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/ADHDisplayCompanionSetup.exe
