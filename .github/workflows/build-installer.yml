name: Build ADHDisplay installer

# Manually triggered (Actions tab -> Build ADHDisplay installer -> Run
# workflow) rather than on every push, since compiling the installer isn't
# needed for most commits and this keeps Actions usage to only when you
# actually want a new ADHDisplaySetup.exe to hand to the client. The
# Companion app's own separate Windows installer (ADHDisplayCompanionSetup.exe)
# is built by the separate build-companion-installers.yml workflow instead -
# a fully independent package with its own release cadence. The Companion
# app's Android TV APK, however, is built right here (see the "Build
# Companion Android TV APK" step below) since adhdisplay.iss's own [Files]
# section bundles it inside this installer - see that .iss's header comment
# and installer/build-with-apk.ps1, the equivalent local (non-CI) build path.
on:
  workflow_dispatch: {}

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download latest Node.js LTS installer
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri 'https://nodejs.org/dist/index.json'
          $lts = $releases | Where-Object { $_.lts -ne $false } | Select-Object -First 1
          $url = "https://nodejs.org/dist/$($lts.version)/node-$($lts.version)-x64.msi"
          Write-Host "Downloading Node.js $($lts.version) ($($lts.lts)) from $url"
          Invoke-WebRequest -Uri $url -OutFile 'installer/node-lts-x64.msi'

      - name: Download latest Ollama installer
        shell: pwsh
        run: |
          # ollama.com/download/OllamaSetup.exe always serves the current
          # release (no versioned URL to resolve first, unlike Node above),
          # so this keeps the bundled copy fresh on every CI-built installer -
          # see adhdisplay.iss's own header comment for why it's bundled
          # in [Files] rather than downloaded again at install time.
          Invoke-WebRequest -Uri 'https://ollama.com/download/OllamaSetup.exe' -OutFile 'installer/OllamaSetup.exe'

      # Same treatment as the Node.js/Ollama installers above: re-fetchable
      # third-party content, downloaded fresh per CI build rather than
      # committed (public/fonts is gitignored). ~36 MB of woff2 covering every
      # family in src/data/googleFonts.json, which the installer then ships via
      # its existing "..\public\*" entry so a kiosk renders correct typography
      # with no internet access. Needs Node before it runs, unlike the two
      # plain Invoke-WebRequest steps above.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download Google Fonts for offline use
        run: |
          npm ci
          npm run fonts:fetch

      # The assistant's default text model, pre-seeded into Ollama's own store
      # layout so a kiosk needs no download to use it (see adhdisplay.iss's
      # header comment). ~2.5 GB on top of the ~2.5 GB it then adds to the
      # compiled installer, so this job now wants roughly 7 GB free on the
      # runner. Every blob is sha256-verified by the script itself, so a
      # truncated download fails here rather than on a customer's machine.
      - name: Download bundled Ollama model
        run: npm run ollama:fetch

      # GitHub's windows-latest runner already ships an Android SDK
      # (ANDROID_HOME/ANDROID_SDK_ROOT preset, build-tools/platforms covering
      # this project's targetSdk=34 - see adhdisplay-companion/README.md), so
      # only the JDK needs pinning explicitly; Gradle wants 17 here (see
      # scripts/build-tv-apk.js's own Kotlin-version comment for the sibling
      # Gradle/Kotlin pin).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Produces the signed release APK that adhdisplay.iss's own [Files]
      # glob (..\adhdisplay-companion\dist\adhdisplay-companion-*.apk) expects
      # to already exist at compile time - see that .iss's header comment and
      # installer/build-with-apk.ps1 (the same two steps, for a local build).
      # The signing keystore is committed (adhdisplay-companion/keystore/),
      # so this needs no secrets to produce a stably-signed APK.
      - name: Install Companion app dependencies
        run: npm install
        working-directory: adhdisplay-companion

      - name: Build Companion Android TV APK
        run: npm run build:tv
        working-directory: adhdisplay-companion

      - name: Compile installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\adhdisplay.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADHDisplaySetup
          path: installer/Output/ADHDisplaySetup.exe
